# E-JUST Guest Housing: production stack for on-premises hosting.
#
#   cp .env.production.example .env.production   # then fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Services
#   db       PostgreSQL 15, private to this stack (no port published)
#   backend  FastAPI API, runs migrations on start
#   guest    Public booking site            -> host port ${GUEST_PORT:-80}
#   admin    Housing office dashboard        -> host port ${ADMIN_PORT:-8080}
#   backup   Nightly pg_dump, keeps ${BACKUP_KEEP_DAYS:-14} days in ./backups
#
# Put the university's HTTPS reverse proxy in front of the guest and admin ports.

name: ejust-housing

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-housing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-ejust_housing}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_SSL: disable  # db is on the private Docker network
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-housing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ejust_housing}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env.production}
      ACCESS_TOKEN_EXPIRE_HOURS: ${ACCESS_TOKEN_EXPIRE_HOURS:-12}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
      PAYMOB_HMAC_KEY: ${PAYMOB_HMAC_KEY:-}
      PAYMOB_INTEGRATION_ID: ${PAYMOB_INTEGRATION_ID:-}
      BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  guest:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        APP_DIR: guest-site
    restart: unless-stopped
    ports:
      - "${GUEST_PORT:-80}:80"
    depends_on: [backend]
    networks: [internal]

  admin:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        APP_DIR: web-app
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on: [backend]
    networks: [internal]

  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-housing}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-ejust_housing}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/ejust_housing_$$(date +%Y%m%d_%H%M).sql.gz
          pg_dump --no-owner | gzip > "$$f" && echo "Backup written: $$f"
          find /backups -name '*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

volumes:
  db_data:

networks:
  internal:
